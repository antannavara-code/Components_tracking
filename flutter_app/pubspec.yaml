name: qr_asset_tracker
description: "QR-based hardware asset and component tracking system"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.0
  path: ^1.9.0
  mobile_scanner: ^6.0.2
  pdf: ^3.11.3
  printing: ^5.13.4
  intl: ^0.20.2
  share_plus: ^10.1.4
  barcode: ^2.2.7
  unified_esc_pos_printer: ^3.4.0
  image_picker: ^1.2.2
  fl_chart: ^0.66.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/fwd_logo.png
    - assets/images/factory_background.png
    - assets/images/categories/
